<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rounak Ray</title>
  <link rel="stylesheet" href="style-original.css?v=8" />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa&display=swap" rel="stylesheet" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet" />
  <style>
    body {
        background: url('hobby.jpg') no-repeat center center fixed;
        background-size: cover;
    }
   .carousel-container {
      width: 600px;
      padding-top: 80px; /* or any value you want */
      position: relative;
    }

    .carousel-slide {
      display: none;
      height: 500px;           /* Fixed height */
      width: 100%;
      object-fit: cover;
      object-position: center;
      text-align: center;      /* Center caption text */
    }

    .carousel-slide.active {
      display: block;
    }

    .carousel-slide img {
      width: 100%;
      height: 450px;           /* Adjust height for image */
      width: auto;         /* Width auto to keep aspect ratio */
      object-fit: contain; /* Keep full image in view, no cropping */
      object-position: center;
      display: block;
      margin: 0 auto;
    }

    .caption {
      font-size: 1em;
      padding: 8px 0;
      color: #333;
    }

    /* Tablets and phones: heading above the photo, photo shrinks to fit the screen */
    @media (max-width: 1024px) {
      .carousel-container {
        width: 100%;
        max-width: 675px;
        margin: 0 auto;
        padding: 0 10px 16px;
        box-sizing: border-box;
      }
      .carousel-slide {
        height: auto;
      }
      .carousel-slide img {
        width: 100%;
        height: auto;
        aspect-ratio: 3 / 2;
      }
    }

    /* Phones held sideways: keep the whole photo on screen */
    @media (max-height: 500px) and (orientation: landscape) {
      .carousel-container {
        max-width: calc((100vh - 70px) * 1.5);
      }
    }
</style>
</head>
  <body>
    <div class="site-title">Rounak Ray</div>
    <div class="top-right-links">
      <a href="index.html">Home</a>
      <a href="research.html">Research</a>
      <a href="hobby.html" aria-current="page">Hobby</a>
      <a href="CV-Rounak.pdf">CV</a>
    </div>
    
    <a class="scroll-cue" href="#content" aria-label="Scroll down to content">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </a>
    <!-- Main layout --> 
    <div class="main-content" id="content", style="width:100%;background:rgba(255,255,255,0.85);border-radius:12px;">
    <p>
        <h1><span class="highlight">Norway Trip</span></h1>
    </p> 
    <div class="carousel-container">
    <div class="carousel-slide active">
        <img src="Norway/nor1.jpg" alt="Photo 1">
    <div class="caption">Dancing Aurora</div>
  </div>
  <div class="carousel-slide">
    <img src="Norway/nor4.jpg" alt="Photo 2">
    <div class="caption">Fjords</div>
  </div>
  <div class="carousel-slide">
    <img src="Norway/nor3.jpg" alt="Photo 3">
    <div class="caption">No (Sun)-rise</div>
  </div>
  <div class="carousel-slide">
    <img src="Norway/nor5.jpg" alt="Photo 3">
    <div class="caption">Peace, vast sea beyond</div>
  </div>
  <div class="carousel-slide">
    <img src="Norway/nor6.jpg" alt="Photo 3">
    <div class="caption">Snowy vista, bird's perspective seren</div>
  </div>
    </div>
  </div>
  <script>
    let index = 0;
    const slides = document.querySelectorAll('.carousel-slide');
    function showSlide(i) {
      slides.forEach((slide, idx) => {
        slide.classList.remove('active');
        if (idx === i) slide.classList.add('active');
      });
    }
    function nextSlide() {
      index = (index + 1) % slides.length;
      showSlide(index);
    }
    let timer = setInterval(nextSlide, 7500); // Change every 7.5 seconds

    // Swipe left/right on phones and tablets to change photo
    let startX = null, startY = null;
    const carousel = document.querySelector('.carousel-container');
    carousel.addEventListener('touchstart', function (e) {
      startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    }, { passive: true });
    carousel.addEventListener('touchend', function (e) {
      if (startX === null) return;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      startX = null;
      if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
      index = (index + (dx < 0 ? 1 : -1) + slides.length) % slides.length;
      showSlide(index);
      clearInterval(timer);
      timer = setInterval(nextSlide, 7500);
    }, { passive: true });

    // Darken the strip behind the name/menu once scrolled (phones and tablets only)
    (function () {
      function update() { document.documentElement.classList.toggle('scrolled', window.scrollY > 40); }
      update();
      window.addEventListener('scroll', update, { passive: true });
    })();
  </script>
  </body>
</html>
